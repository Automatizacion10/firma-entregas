<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firma de Entrega - grupoInter</title>
<style>
  body{margin:0;background:#f4f4f4;font-family:Segoe UI,Arial,sans-serif;color:#111}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px}
  .logo{font-size:28px;font-weight:700;color:#444;margin-bottom:16px}
  .logo span{color:#c01f2d}
  .card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#555;font-size:14px;margin:0 0 20px}
  label{font-weight:600;font-size:14px}
  canvas{width:100%;height:220px;border:2px dashed #bbb;border-radius:8px;margin-top:8px;touch-action:none;background:#fff;display:block}
  .row{display:flex;gap:12px;margin-top:16px}
  button{flex:1;padding:14px;border:0;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
  #limpiar{background:#eee}
  #enviar{background:#c01f2d;color:#fff}
  button:disabled{opacity:.5;cursor:default}
  #msg{margin-top:16px;text-align:center;font-weight:600;font-size:14px}
  .err{color:#c01f2d}.ok{color:#1a7f37}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">grupo<span>Inter</span></div>
  <div class="card">
    <h1>Confirmación de entrega</h1>
    <p class="sub" id="sub"></p>
    <label>Firma aquí</label>
    <canvas id="c"></canvas>
    <div class="row">
      <button id="limpiar">Limpiar</button>
      <button id="enviar">Confirmar firma</button>
    </div>
    <div id="msg"></div>
  </div>
</div>
<script>
// === CONFIGURAR: URL del trigger HTTP del flujo Guardar_Firma_Entrega ===
const FLOW_URL = "https://defaultd14043ea98d34b2c8f33aefd1f2d86.27.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/26/workflows/4f3dea3a615844e5b4d13cd8ffa7a27c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=lqk4obE3f0_k1gpeRfX-gOxqLpVmwBIif-G3KUU7cE4";

const p = new URLSearchParams(location.search);
const id = p.get("id");
const nombre = p.get("nombre") || "";
const sub = document.getElementById("sub");
const msg = document.getElementById("msg");
const btn = document.getElementById("enviar");
sub.textContent = id ? (nombre ? "Cliente: " + nombre : "Firma para confirmar la recepción.") : "Falta información de la entrega en el enlace.";
if (!id) { msg.textContent = "No se encontró el identificador de la entrega."; msg.className = "err"; btn.disabled = true; }

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let dibujando = false, firmado = false;
function ajustar() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d;
  ctx.scale(d, d); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000";
}
ajustar();
const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener("pointerdown", e => { dibujando = true; firmado = true; const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (!dibujando) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); });
["pointerup", "pointercancel"].forEach(t => cv.addEventListener(t, () => dibujando = false));
document.getElementById("limpiar").onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); firmado = false; msg.textContent = ""; };

btn.onclick = async () => {
  if (!firmado) { msg.textContent = "Por favor firma antes de confirmar."; msg.className = "err"; return; }
  btn.disabled = true; msg.textContent = "Enviando..."; msg.className = "";
  const body = JSON.stringify({ idEntrega: id, nombre: nombre, firma: cv.toDataURL("image/png") });
  try {
    // text/plain evita el preflight CORS; el flujo lo lee con json(triggerBody())
    const r = await fetch(FLOW_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body });
    if (!r.ok) throw new Error(r.status);
    msg.textContent = "Firma registrada. ¡Gracias!"; msg.className = "ok";
  } catch (e) {
    msg.textContent = "No se pudo guardar la firma. Intenta de nuevo."; msg.className = "err"; btn.disabled = false;
  }
};
</script>
</body>
</html>
